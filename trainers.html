<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer Sheet — Run and Bun</title>
<link rel="stylesheet" href="rnb-site.css">
<style>
body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace; }
#app{ display:flex; min-height:100vh; align-items:flex-start; }

#sidebar{
  width:236px; flex:0 0 236px; background:var(--panel);
  border-right:1px solid var(--border); padding:18px 14px;
  position:sticky; top:var(--rnb-bar-h,44px); align-self:flex-start;
  height:calc(100vh - var(--rnb-bar-h,44px)); overflow-y:auto;
  display:flex; flex-direction:column; gap:14px;
}
.side-label{ font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--ink-3); font-weight:700; margin:0 0 6px 2px; }
#nav-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; font-size:12px; }
#nav-list li a{ display:block; padding:6px 9px; border-radius:6px; color:var(--ink-2);
  text-decoration:none; border-left:3px solid transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#nav-list li a:hover{ background:var(--panel-2); color:var(--ink); }
#nav-list li a.active{ border-left-color:var(--accent); color:var(--ink);
  background:var(--panel-2); font-weight:600; }
#nav-list li.sub a{ padding-left:20px; font-size:11px; color:var(--ink-3); }
.side-foot{ margin-top:auto; font-size:10px; color:var(--ink-3); line-height:1.7; }

#main{ flex:1; min-width:0; padding:22px 26px 90px; }
.page-head h1{ font-family:'Press Start 2P', monospace; font-size:14px; line-height:1.7;
  margin:0 0 10px; color:var(--ink); }
.page-head p{ margin:0 0 20px; font-size:12px; color:var(--ink-2); line-height:1.75; max-width:78ch; }

.toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
  padding:12px 14px; margin-bottom:20px; background:var(--panel);
  border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow);
  position:sticky; top:var(--rnb-bar-h,44px); z-index:20; }
.field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.field > label{ font-size:9px; letter-spacing:1.2px; text-transform:uppercase;
  color:var(--ink-3); font-weight:700; }
.grow{ flex:1 1 230px; }
.inp{ width:100%; padding:6px 8px; font-family:inherit; font-size:12px; border-radius:6px;
  border:1px solid var(--border); background:var(--panel-2); color:var(--ink); }
.inp:focus{ outline:none; border-color:var(--accent); }
.btn{ padding:6px 10px; font-family:inherit; font-size:11px; font-weight:600; border-radius:6px;
  cursor:pointer; border:1px solid var(--border); background:var(--panel-2); color:var(--ink-2); }
.btn:hover{ color:var(--ink); border-color:var(--ink-3); }
.btn.on{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
.count{ font-size:10px; color:var(--ink-3); letter-spacing:.6px; margin-left:auto; white-space:nowrap; }

.section-head{ margin:32px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--accent); }
.section-head:first-of-type{ margin-top:0; }
.section-head h2{ font-family:'Press Start 2P', monospace; font-size:12px; margin:0 0 8px; line-height:1.6; }
.section-head p{ margin:0; font-size:11px; color:var(--ink-3); }

.area-head{ margin:22px 0 10px; font-size:11px; letter-spacing:1.4px; text-transform:uppercase;
  font-weight:700; color:var(--accent-2); }

.tcard{ background:var(--panel); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
.tcard > header{ padding:10px 14px; background:var(--panel-2); border-bottom:1px solid var(--border);
  display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline; }
.tcard h3{ font-size:12.5px; margin:0; letter-spacing:.3px; color:var(--accent); }
.tcard .meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-left:auto; }
.chip{ display:inline-block; padding:2px 7px; border-radius:999px; font-size:10px; font-weight:600;
  letter-spacing:.4px; border:1px solid var(--border); background:var(--panel);
  color:var(--ink-3); white-space:nowrap; }

.party{ display:grid; grid-template-columns:repeat(auto-fill,minmax(172px,1fr));
  gap:1px; background:var(--border); }
.mon{ background:var(--panel); padding:10px 11px 11px; display:flex; flex-direction:column; gap:7px; }
.mon .top{ display:flex; gap:8px; align-items:center; }
.mon img{ width:56px; height:56px; flex:0 0 56px; image-rendering:pixelated; }
.mon .id{ min-width:0; }
.mon .nm{ font-size:12px; font-weight:700; line-height:1.3; word-break:break-word; }
.mon .nm .form{ display:block; font-size:9px; color:var(--ink-3); font-weight:400; letter-spacing:.5px; }
.mon .lv{ font-size:10px; color:var(--ink-3); letter-spacing:.5px; margin-top:2px;
  font-variant-numeric:tabular-nums; }
.mon .types{ display:flex; gap:3px; margin-top:4px; flex-wrap:wrap; }
.kv{ font-size:10px; line-height:1.65; }
.kv span{ color:var(--ink-3); }
.kv b{ font-weight:600; }
.moves{ display:flex; flex-direction:column; gap:3px; }
.mv{ display:flex; align-items:center; gap:5px; font-size:10px; }
.mv .nmv{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.type{ display:inline-block; padding:2px 7px; border-radius:4px; font-size:9px; font-weight:700;
  letter-spacing:.8px; text-transform:uppercase; color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.35); white-space:nowrap; }
.t-Normal{background:#9099A1}.t-Fire{background:#E2603B}.t-Water{background:#3E8BD6}
.t-Electric{background:#D9A400}.t-Grass{background:#4C9A4A}.t-Ice{background:#5FBFC4}
.t-Fighting{background:#B8393A}.t-Poison{background:#8B4E9E}.t-Ground{background:#B07B3C}
.t-Flying{background:#7A8ED4}.t-Psychic{background:#DD5C8A}.t-Bug{background:#8A9B26}
.t-Rock{background:#A08B4C}.t-Ghost{background:#5E5A93}.t-Dragon{background:#5B48C4}
.t-Dark{background:#5A4A42}.t-Steel{background:#6E8A99}.t-Fairy{background:#D77BA6}
.cat{ display:inline-block; width:15px; text-align:center; border-radius:3px; font-size:9px;
  font-weight:700; padding:1px 0; color:#fff; }
.cat.P{background:#B8393A}.cat.S{background:#3E6FD6}.cat.T{background:#7B8288}

.empty{ color:var(--ink-3); font-size:12px; padding:30px 4px; text-align:center; }

@media (max-width:900px){
  #app{ flex-direction:column; }
  #sidebar{ width:100%; height:auto; position:static; flex-direction:row;
    flex-wrap:wrap; align-items:center; gap:10px; padding:12px; }
  #sidebar .side-scroll{ display:none; }
  #main{ padding:16px 14px 70px; }
  .toolbar{ position:static; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-scroll" style="display:flex;flex-direction:column;gap:6px;min-height:0">
      <p class="side-label">Jump to</p>
      <ul id="nav-list"></ul>
    </div>
    <div class="side-foot">436 trainers · 1,832 Pokémon<br>Straight from the RnB battle data.</div>
  </aside>

  <main id="main">
    <div class="page-head">
      <h1>Trainer Sheet</h1>
      <p>Every trainer in Run and Bun, in play order, with the exact set each Pokémon carries. Search by trainer, species, item, ability or move.</p>
    </div>

    <div class="toolbar">
      <div class="field grow">
        <label for="q">Search trainer / species / item / ability / move</label>
        <input id="q" class="inp" type="search" placeholder="e.g. Sticky Web, Salamence, Norman, Focus Sash" autocomplete="off">
      </div>
      <div class="field">
        <label for="sec">Split</label>
        <select id="sec" class="inp"></select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="fullOnly" class="btn">Full teams only</button>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div id="list"></div>
  </main>
</div>

<script src="rnb-site.js" defer></script>
<script src="rnb-data.js"></script>
<script src="rnb-trainers.js" defer></script>
</body>
</html>
