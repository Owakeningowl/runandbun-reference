<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dex — Run and Bun</title>
<link rel="stylesheet" href="rnb-site.css">
<style>
html,body{ height:100%; }
body{ margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace; }
#rnb-bar{ flex:0 0 auto; position:static; }
#frame-note{ flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 16px; font-size:10.5px; color:var(--ink-3);
  background:var(--panel-2); border-bottom:1px solid var(--border); }
#frame-note a{ color:var(--accent); text-decoration:none; font-weight:600; }
#frame-note a:hover{ text-decoration:underline; }
#frame-wrap{ flex:1 1 auto; min-height:0; position:relative; }
#frame-wrap iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }
#frame-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding:30px; text-align:center; font-size:12px; line-height:1.8; color:var(--ink-2);
  background:var(--bg); pointer-events:none; opacity:1; transition:opacity .2s; }
#frame-wrap.loaded #frame-fallback{ opacity:0; }
</style>
</head>
<body>
<div id="frame-note">
  <span>Live embed of may8th1995's RBDex — always the current version.</span>
  <a href="https://may8th1995.github.io/RBDex/" target="_blank" rel="noopener">Open it in its own tab ↗</a>
</div>
<div id="frame-wrap">
  <div id="frame-fallback">Loading Dex…<br>If it stays blank, open it in its own tab with the link above.</div>
  <iframe src="https://may8th1995.github.io/RBDex/" title="Dex" loading="eager"
          onload="this.parentNode.classList.add('loaded')"></iframe>
</div>
<script src="rnb-site.js" defer></script>
</body>
</html>
