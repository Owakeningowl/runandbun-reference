<script id="rnb-history-shim">
/* <base> makes history.pushState/replaceState resolve their URL against the
   upstream origin, which throws SecurityError and kills the app's init.
   Keep the call, drop the cross-origin URL. */
(function(){
  function wrap(fn){
    return function(state, title, url){
      try { return fn.call(history, state, title, url); }
      catch(e){ try { return fn.call(history, state, title); } catch(_){} }
    };
  }
  history.replaceState = wrap(History.prototype.replaceState);
  history.pushState    = wrap(History.prototype.pushState);
})();
</script>

<style id="astral-injected">
/* ============================================================
   Astral theme for the Run and Bun Pokedex (Showdown pokedex).
   The damage calc and the dex are different apps with different
   stylesheets, so this targets the pokedex's own classes.
   ============================================================ */
:root{
  --a-bg:#15181f; --a-panel:#1c2028; --a-panel-2:#20242e;
  --a-line:#2b3140; --a-ink:#d1d5de; --a-ink-2:#98a0b0; --a-ink-3:#6b7383;
  --a-accent:#3a4462; --a-accent-2:#485480;
}
html, body{ background:var(--a-bg) !important; color:var(--a-ink) !important; }

/* top nav (Pokedex / Calc / Play) — hidden inside the embed */
.pfx-topbar{ display:none !important; }
body{ padding-top:0 !important; }

/* panels */
.pfx-panel, .pfx-body, .ps-popup, .pfx-panel .pad{
  background:var(--a-bg) !important; color:var(--a-ink) !important;
}
.pfx-panel{ border-color:var(--a-line) !important; }

h1,h2,h3,h4,.pfx-panel h1{ color:var(--a-ink) !important; }
a{ color:#8fb0e0 !important; }
a:hover{ color:#b6cdf0 !important; }
p, li, td, th, label, span{ color:inherit; }
hr{ border-color:var(--a-line) !important; }

/* search box */
input[type=text], input[type=search], input.textbox, textarea, select{
  background:var(--a-panel) !important; color:var(--a-ink) !important;
  border:1px solid var(--a-line) !important; border-radius:6px !important;
}
input::placeholder{ color:var(--a-ink-3) !important; }
input:focus, select:focus{ border-color:var(--a-accent-2) !important; outline:none !important; }

/* the tab strip (Search / Pokemon / Locations / Moves) */
.search-tabs, .tabbar, .buttonbar{ background:transparent !important; }
button, .button, .tabbar button{
  background:var(--a-panel) !important; color:var(--a-ink-2) !important;
  border:1px solid var(--a-line) !important; border-radius:6px !important;
}
button:hover, .button:hover{ background:var(--a-panel-2) !important; color:var(--a-ink) !important; }
button.cur, .button.cur, button[aria-selected="true"]{
  background:var(--a-accent) !important; color:#fff !important;
  border-color:var(--a-accent-2) !important;
}

/* result rows (utilichart) */
.utilichart, .utilichart li, .resultheader, .result{
  background:var(--a-bg) !important; color:var(--a-ink) !important;
}
.utilichart a, .utilichart li a{
  background:var(--a-panel) !important; color:var(--a-ink) !important;
  border-color:var(--a-line) !important;
}
.utilichart a:hover{ background:var(--a-panel-2) !important; }
.utilichart .col, .utilichart .colv, .utilichart .numcol{ color:var(--a-ink-2) !important; }
.utilichart .pokemonnamecol, .utilichart .movenamecol{ color:var(--a-ink) !important; font-weight:600; }
.resultheader h3, .utilichart h3{
  background:var(--a-panel-2) !important; color:var(--a-ink-2) !important;
  border-color:var(--a-line) !important;
}
.statbar, .barbg{ background:var(--a-panel-2) !important; }

/* tables */
table, .dexentry table{ background:var(--a-bg) !important; }
th{ background:var(--a-panel-2) !important; color:var(--a-ink-2) !important;
    border-color:var(--a-line) !important; }
td{ border-color:var(--a-line) !important; }
tr:nth-child(even) td{ background:var(--a-panel) !important; }

/* keep type/category icons legible on dark */
img[src*="types"], img[src*="categories"]{ filter:none !important; }

</style>

<script id="rnb-chrome-js">
(function(){
  /* Inside the AI doc's Tools overlay this page is an iframe and that overlay
     already supplies the tabs, Screen and Zoom. Two bars would stack. */
  if (window.self !== window.top) {
    var _b = document.getElementById('rnb-bar');
    if (_b) _b.parentNode.removeChild(_b);
    var _h = document.querySelector('body > header');
    if (_h) _h.style.top = '0px';
    return;
  }
  var KEY='dex';
  var FILTERS=[{n:'Normal',v:''},{n:'Dim',v:'brightness(.82) contrast(1.04)'}];
  var ZOOMS=[75,90,100,110,125,150], ZOOM_DEFAULT=2;
  var content=document.getElementById('rnb-content');
  var sBtn=document.getElementById('rnb-screen'),
      zBtn=document.getElementById('rnb-zoom'),
      zIn=document.getElementById('rnb-zoom-in'),
      zOut=document.getElementById('rnb-zoom-out');
  function get(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:+v; }catch(e){ return d; } }
  function set(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }

  function paintFilter(){
    var i=get('rnb-filter-'+KEY,0); if(!FILTERS[i]) i=0;
    if(content) content.style.filter=FILTERS[i].v;
    sBtn.textContent='Screen: '+FILTERS[i].n;
  }
  function paintZoom(){
    var i=get('rnb-zoom-'+KEY,ZOOM_DEFAULT); if(!ZOOMS[i]) i=ZOOM_DEFAULT;
    if(content) content.style.zoom=ZOOMS[i]+'%';
    zBtn.textContent='Zoom: '+ZOOMS[i]+'%';
  }
  function stepZoom(d){
    var i=get('rnb-zoom-'+KEY,ZOOM_DEFAULT)+d;
    i=Math.max(0,Math.min(ZOOMS.length-1,i)); set('rnb-zoom-'+KEY,i); paintZoom();
  }
  sBtn.addEventListener('click',function(){
    set('rnb-filter-'+KEY,(get('rnb-filter-'+KEY,0)+1)%FILTERS.length); paintFilter(); });
  zBtn.addEventListener('click',function(){
    set('rnb-zoom-'+KEY,(get('rnb-zoom-'+KEY,ZOOM_DEFAULT)+1)%ZOOMS.length); paintZoom(); });
  zIn.addEventListener('click',function(){ stepZoom(1); });
  zOut.addEventListener('click',function(){ stepZoom(-1); });
  paintFilter(); paintZoom();
})();
</script>
